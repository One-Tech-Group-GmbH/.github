name: newsroom cards

on:
  schedule:
    - cron: "17 5 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_news.py
      - name: Commit if the feed changed
        run: |
          if [ -n "$(git status --porcelain profile)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile
            git commit -m "Update newsroom cards"
            git push
          fi
